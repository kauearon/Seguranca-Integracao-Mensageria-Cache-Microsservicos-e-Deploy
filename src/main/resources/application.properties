spring.application.name=java-parte-sete
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Exercício 16: host mysql é o nome do serviço no Docker Compose.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/laboratorio}
spring.datasource.username=${MYSQL_USER:lab}
spring.datasource.password=${MYSQL_PASSWORD:}

# Exercício 19: listener habilitado no Compose com RabbitMQ em execução.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${RABBIT_ENABLED:false}

# Exercício 14: somente laboratório; credenciais e segredo vêm do ambiente.
app.lab.usuario=${LAB_USER:aluno}
app.lab.senha=${LAB_PASSWORD:}
app.jwt.segredo=${JWT_SECRET:}

# Exercício 18: serviço remoto que implementa GET /fretes/{cep}.
app.fretes.base-url=${FRETES_BASE_URL:http://localhost:8081}

# Exercício 20: máximo 100 resultados e TTL de 10 minutos.
spring.cache.type=caffeine
spring.cache.cache-names=fretes
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m
